
services:
  redis:
    image: redis:7-alpine
    container_name: orion-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - core

  postgres:
    image: postgres:15-alpine
    container_name: orion-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - orion_pgdata:/var/lib/postgresql/data
      - ./infra/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - core

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: orion-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm.json
    networks:
      - edge
      - core
    depends_on:
      postgres:
        condition: service_healthy

  opa:
    image: openpolicyagent/opa:latest
    container_name: orion-opa
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=debug"
      - "/policy"
    volumes:
      - ./policy/opa:/policy
    networks:
      - core


  nats:
    image: nats:alpine
    container_name: orion-nats
    command: "-js --user ${NATS_USER} --pass ${NATS_PASSWORD}"
 # monitoring
    networks:
      - core

  ascend-lb:
    image: nginx:alpine
    container_name: orion-ascend-lb
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edge

  orion-api:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: orion-api
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app/apps/api:/app
      - DATABASE_URL=${DATABASE_URL}
      - NATS_URL=nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - KEYCLOAK_JWKS_URL=http://keycloak:8080/realms/orion/protocol/openid-connect/certs
      - OPA_URL=http://opa:8181/v1/data/orion/authz/allow
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    networks:
      - edge
      - core

    depends_on:
      - postgres
      - nats
      - keycloak
      - opa

  orion-worker:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: orion-worker
    command: python -u services/worker/main.py
    environment:
      - PYTHONPATH=/app/apps/api:/app
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@orion-redis:6379/0
      - NATS_URL=nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      - nats
      - postgres
    networks:
      - core

  orion-sentinel:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: orion-sentinel
    command: python -u services/ai_sentinel/main.py
    environment:
      - PYTHONPATH=/app/apps/api:/app
      - NATS_URL=nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OLLAMA_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - nats
    networks:
      - core

  orion-aegis:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: orion-aegis
    command: python -u services/aegis/main.py
    environment:
      - PYTHONPATH=/app/apps/api:/app
      - NATS_URL=nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      - nats
    networks:
      - core

  orion-dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: orion-dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
      - NEXT_PUBLIC_KEYCLOAK_URL=http://localhost:8080
    networks:
      - edge


  prometheus:
    image: prom/prometheus:latest
    container_name: orion-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      - orion-api
    networks:
      - core

  grafana:
    image: grafana/grafana:latest
    container_name: orion-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-orion_grafana_CHANGE_ME}
    depends_on:
      - prometheus
    networks:
      - edge
      - core

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: orion-jaeger
    networks:
      - core




networks:
  edge:
  core:
volumes:
  orion_pgdata:







