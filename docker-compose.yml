version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: orion-postgres
    environment:
      POSTGRES_USER: orion_admin
      POSTGRES_PASSWORD: orion_password
      POSTGRES_DB: keycloak
    volumes:
      - orion_pgdata:/var/lib/postgresql/data
      - ./infra/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion_admin -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: orion-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: orion_admin
      KC_DB_PASSWORD: orion_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  opa:
    image: openpolicyagent/opa:latest
    container_name: orion-opa
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=debug"
      - "/policy"
    volumes:
      - ./policy/opa:/policy
    ports:
      - "8181:8181"

  nats:
    image: nats:alpine
    container_name: orion-nats
    command: "-js"
    ports:
      - "4222:4222"
      - "8222:8222" # monitoring

volumes:
  orion_pgdata:
