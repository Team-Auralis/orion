# ==============================================================================
# ORION AI Training Configuration: Qwen 27B Target Specification
# ==============================================================================
# TARGET MODEL   : Qwen3.8-27B (Pending weight download or cloud cluster execution)
# BASELINE MODEL : Qwen/Qwen2.5-0.5B (Verified local baseline in models/qwen_instruct)
# 
# NOTE: D:/Qwen3.8-27B currently contains LFS stubs (0/18 shards on disk).
# Running local SFT requires either:
#   1. Downloading 4-bit quantized shards (Q4_K_M)
#   2. Cloud GPU execution via `soup apply`
# ==============================================================================
base: D:/Qwen3.8-27B
task: sft

data:
  train: scripts/data.jsonl
  format: alpaca
  max_length: 2048

training:
  epochs: 3
  lr: 1e-5
  batch_size: 1
  gradient_accumulation_steps: 8
  stream_layers: true
  lora:
    r: 16
    alpha: 32
    target_modules: auto
  quantization: 4bit

output: ./models/orion_qwen27b_lora
