events {
    worker_connections 1024;
}

http {
    upstream orion_api_backend {
        # ASCEND: Simulating a multi-region/multi-node backend load balancing tier
        # In a real environment, this routes between Region A and Region B clusters.
        # Here, we route to the host's port 8001 (FastAPI).
        server host.docker.internal:8001 weight=1 max_fails=3 fail_timeout=30s;
        
        # We can add a placeholder for a second regional node to prove the architecture
        server host.docker.internal:8002 weight=1 max_fails=3 fail_timeout=30s backup;
    }

    server {
        listen 80;
        server_name orion.nexus;

        location / {
            proxy_pass http://orion_api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Global resiliency: retry on another node if the primary is down
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}
